name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (tests)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: services/api }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import the app (catches missing modules / config attrs)
        run: python -c "from app.main import app; print(app.title)"
      - name: Run the test suite
        run: python -m pytest tests/ -q

  sdk-python:
    name: Python SDK (tests)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: sdk/python }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest httpx sqlalchemy
      - name: Import the package (catches broken entry points)
        run: python -c "import codexray; print(codexray.__version__)"
      - name: Run the test suite
        run: python -m pytest tests/ -q

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # webpack, not the default Turbopack: its Google-font replacer assumes a
      # single next/font/google query and fails on our three-font layout.
      - name: Build the dashboard (catches broken imports and type errors)
        run: npx next build --webpack
