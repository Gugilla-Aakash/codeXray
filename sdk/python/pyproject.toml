[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexray-sdk"
version = "0.1.0"
description = "CodeXRay telemetry SDK — watch your software think"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CodeXRay authors" }]
keywords = ["telemetry", "observability", "tracing", "codexray", "opentelemetry-alternative"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Gugilla-Aakash/codeXray"
Repository = "https://github.com/Gugilla-Aakash/codeXray"
Issues = "https://github.com/Gugilla-Aakash/codeXray/issues"

[project.scripts]
codexray = "codexray.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codexray*"]
